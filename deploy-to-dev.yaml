## Tag and Deploy

### 1. Commit and tag

```bash
cd /home/andrew/src/github.com/rhpds/showroom-soundcheck
git add <files>
git commit -m "your message"
git tag v1.X.Y
git push origin main v1.X.Y
```

The tag push triggers the `app-image-publish` GitHub Actions workflow, which builds and pushes:
- `quay.io/rhpds/showroom-soundcheck-backend:v1.X.Y`
- `quay.io/rhpds/showroom-soundcheck-frontend:v1.X.Y`

### 2. Wait for CI

```bash
gh run list --repo rhpds/showroom-soundcheck --workflow app-image-publish --limit 1
```

Wait until it shows `completed success`.

### 3. Update the deployment manifests

Edit `deploy/app-deployment.yaml`, `deploy/worker-deployment.yaml`, and `deploy/frontend-deployment.yaml` -- update the image tags and version labels to match:

```
# app-deployment.yaml + worker-deployment.yaml
image: quay.io/rhpds/showroom-soundcheck-backend:v1.X.Y

# frontend-deployment.yaml
image: quay.io/rhpds/showroom-soundcheck-frontend:v1.X.Y

# all of the above
app.kubernetes.io/version: v1.X.Y
```

### 4. Apply to OCP

```bash
for f in deploy/*.yaml; do
  base=$(basename "$f")
  case "$base" in
    namespace.yaml|*-secret.yaml) continue ;;
  esac
  sed 's/namespace: showroom-soundcheck$/namespace: showroom-soundcheck-dev/' "$f" \
    | oc apply -n showroom-soundcheck-dev -f -
done
```

Or to just update individual deployments:

```bash
oc set image deployment/showroom-soundcheck-app \
  app=quay.io/rhpds/showroom-soundcheck-backend:v1.X.Y \
  -n showroom-soundcheck-dev

oc set image deployment/showroom-soundcheck-frontend \
  frontend=quay.io/rhpds/showroom-soundcheck-frontend:v1.X.Y \
  -n showroom-soundcheck-dev

oc set image deployment/showroom-soundcheck-orchestration-worker \
  worker=quay.io/rhpds/showroom-soundcheck-backend:v1.X.Y \
  -n showroom-soundcheck-dev

oc set image deployment/showroom-soundcheck-check-worker \
  worker=quay.io/rhpds/showroom-soundcheck-backend:v1.X.Y \
  -n showroom-soundcheck-dev
```

### 5. Verify

```bash
oc rollout status deployment/showroom-soundcheck-app -n showroom-soundcheck-dev --timeout=120s
oc rollout status deployment/showroom-soundcheck-frontend -n showroom-soundcheck-dev --timeout=120s
oc rollout status deployment/showroom-soundcheck-orchestration-worker -n showroom-soundcheck-dev --timeout=120s
oc rollout status deployment/showroom-soundcheck-check-worker -n showroom-soundcheck-dev --timeout=120s
oc get pods -n showroom-soundcheck-dev
```

Route URL: `https://showroom-soundcheck-dev.apps.ocpv-infra01.dal12.infra.demo.redhat.com`

