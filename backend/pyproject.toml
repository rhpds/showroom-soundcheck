[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showroom-soundcheck"
version = "0.2.0"
description = "Session-based health check tool for showroom environments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.0,<3",
    "sqlmodel>=0.0.22,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "saq[redis,web,hiredis]>=0.26,<1",
    "redis[hiredis]>=5.0,<6",
    "python-json-logger>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["soundcheck*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "UP046",  # Generic[T] subclass -- required by Pydantic BaseModel
    "SIM105", # contextlib.suppress -- try/except/pass is often clearer
]

[tool.ruff.lint.isort]
known-first-party = ["soundcheck"]

[tool.ruff.lint.flake8-bugbear]
# Ruff's built-in fastapi exemption for B008 doesn't recognize `Query()` when
# the parameter is annotated as a generic (e.g. `list[str] | None`), even
# though `Query()` is required there to avoid a mutable default. Extend the
# allowlist explicitly instead of scattering `# noqa: B008` comments.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]
