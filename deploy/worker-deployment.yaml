---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-soundcheck-orchestration-worker
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: showroom-soundcheck-orchestration-worker
    app.kubernetes.io/version: v1.3.0
    app.kubernetes.io/part-of: showroom-soundcheck
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: showroom-soundcheck-orchestration-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showroom-soundcheck-orchestration-worker
        app.kubernetes.io/version: v1.3.0
        app.kubernetes.io/part-of: showroom-soundcheck
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: quay.io/rhpds/showroom-soundcheck-backend:v1.3.0
          imagePullPolicy: IfNotPresent
          command:
            - saq
            - soundcheck.worker.orchestration_settings
            - --workers
            - "1"
          envFrom:
            - configMapRef:
                name: showroom-soundcheck-config
            - secretRef:
                name: postgres-credentials
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /app
          volumeMounts:
            - name: babylon-kubeconfigs
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: babylon-kubeconfigs
          secret:
            secretName: babylon-kubeconfigs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-soundcheck-check-worker
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: showroom-soundcheck-check-worker
    app.kubernetes.io/version: v1.3.0
    app.kubernetes.io/part-of: showroom-soundcheck
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: showroom-soundcheck-check-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showroom-soundcheck-check-worker
        app.kubernetes.io/version: v1.3.0
        app.kubernetes.io/part-of: showroom-soundcheck
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: quay.io/rhpds/showroom-soundcheck-backend:v1.3.0
          imagePullPolicy: IfNotPresent
          command:
            - saq
            - soundcheck.worker.check_settings
            - --workers
            - "1"
          envFrom:
            - configMapRef:
                name: showroom-soundcheck-config
            - secretRef:
                name: postgres-credentials
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /app
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
