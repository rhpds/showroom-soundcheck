---
# Default deny all ingress in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/part-of: showroom-soundcheck
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress to the oauth-proxy from the OpenShift router
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router-to-proxy
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: oauth-proxy
    app.kubernetes.io/part-of: showroom-soundcheck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 4180
---
# Allow oauth-proxy to reach the app on port 8000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-app
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: showroom-soundcheck-app
    app.kubernetes.io/part-of: showroom-soundcheck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: showroom-soundcheck-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth-proxy
      ports:
        - protocol: TCP
          port: 8000
---
# Allow app pods to reach postgres on port 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: showroom-soundcheck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: showroom-soundcheck-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: showroom-soundcheck-orchestration-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: showroom-soundcheck-check-worker
      ports:
        - protocol: TCP
          port: 5432
---
# Allow app and workers to reach redis on port 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-redis
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: showroom-soundcheck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: showroom-soundcheck-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: showroom-soundcheck-orchestration-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: showroom-soundcheck-check-worker
      ports:
        - protocol: TCP
          port: 6379
