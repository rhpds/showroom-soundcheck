---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-soundcheck-app
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: showroom-soundcheck-app
    app.kubernetes.io/version: v1.0.10
    app.kubernetes.io/part-of: showroom-soundcheck
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: showroom-soundcheck-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showroom-soundcheck-app
        app.kubernetes.io/version: v1.0.10
        app.kubernetes.io/part-of: showroom-soundcheck
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: app
          image: quay.io/rhpds/showroom-soundcheck-app:v1.0.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: frontend
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: showroom-soundcheck-config
            - secretRef:
                name: postgres-credentials
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /app
          volumeMounts:
            - name: babylon-kubeconfigs
              mountPath: /secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /ping
              port: frontend
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ping
              port: frontend
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: frontend
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: babylon-kubeconfigs
          secret:
            secretName: babylon-kubeconfigs
