---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: showroom-soundcheck-app
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: showroom-soundcheck-app
    app.kubernetes.io/part-of: showroom-soundcheck
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: showroom-soundcheck-app
  unhealthyPodEvictionPolicy: AlwaysAllow
