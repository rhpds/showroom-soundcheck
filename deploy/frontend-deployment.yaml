---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-soundcheck-frontend
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: showroom-soundcheck-frontend
    app.kubernetes.io/version: v1.1.2
    app.kubernetes.io/part-of: showroom-soundcheck
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: showroom-soundcheck-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showroom-soundcheck-frontend
        app.kubernetes.io/version: v1.1.2
        app.kubernetes.io/part-of: showroom-soundcheck
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: quay.io/rhpds/showroom-soundcheck-frontend:v1.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: BACKEND_URL
              value: "http://showroom-soundcheck-app:8000"
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
