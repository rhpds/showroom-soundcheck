---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showroom-soundcheck-config
  namespace: showroom-soundcheck
  labels:
    app.kubernetes.io/name: showroom-soundcheck-app
    app.kubernetes.io/part-of: showroom-soundcheck
data:
  APP_TIMEZONE: "UTC"
  CHECK_CONCURRENCY: "10"
  VERIFY_SSL: "false"
  REFLEX_ENV: "prod"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  BABYLON_CLUSTERS: '["/secrets/east.kubeconfig","/secrets/west.kubeconfig"]'
