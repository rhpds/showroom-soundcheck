---
name: app-image-publish
on:
  push:
    paths:
      - backend/Dockerfile
      - backend/**
      - frontend/Dockerfile
      - frontend/**
    tags:
      - v*
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/**
      - frontend/Dockerfile
      - frontend/**

jobs:
  backend:
    runs-on: ubuntu-24.04
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-labels: ${{ steps.meta.outputs.labels }}
      image-digest: ${{ steps.build.outputs.digest }}
      should-push: ${{ steps.should-push.outputs.result }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/rhpds/showroom-soundcheck-backend
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=pr,prefix=pr-
          flavor: |
            latest=auto

      - name: Determine if we should push
        id: should-push
        run: |
          if [[ "${{ steps.meta.outputs.tags }}" != "" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          outputs: ${{ steps.should-push.outputs.result == 'true' && 'type=docker,dest=/tmp/backend-image.tar' || 'type=docker' }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: steps.should-push.outputs.result == 'true'
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  frontend:
    runs-on: ubuntu-24.04
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-labels: ${{ steps.meta.outputs.labels }}
      image-digest: ${{ steps.build.outputs.digest }}
      should-push: ${{ steps.should-push.outputs.result }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/rhpds/showroom-soundcheck-frontend
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=pr,prefix=pr-
          flavor: |
            latest=auto

      - name: Determine if we should push
        id: should-push
        run: |
          if [[ "${{ steps.meta.outputs.tags }}" != "" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          outputs: ${{ steps.should-push.outputs.result == 'true' && 'type=docker,dest=/tmp/frontend-image.tar' || 'type=docker' }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: steps.should-push.outputs.result == 'true'
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          retention-days: 1

  push:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    if: needs.backend.outputs.should-push == 'true'
    strategy:
      matrix:
        include:
          - artifact: backend-image
            tags: ${{ needs.backend.outputs.image-tags }}
          - artifact: frontend-image
            tags: ${{ needs.frontend.outputs.image-tags }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/${{ matrix.artifact }}.tar

      - name: Login to quay.io registry
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_RHPDS_USERNAME }}
          password: ${{ secrets.QUAY_IO_RHPDS_TOKEN }}

      - name: Push image to registry
        run: |
          TAGS="${{ matrix.tags }}"
          echo "$TAGS" | while IFS= read -r tag; do
            tag=$(echo "$tag" | xargs)
            [ -n "$tag" ] && docker push "$tag"
          done

  release-metadata:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, push]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Prepare release metadata
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          {
            echo "TAG=${TAG_NAME}"
            echo ""
            echo "## Backend"
            echo "DIGEST=${{ needs.backend.outputs.image-digest }}"
            echo "TAGS:"
            echo "${{ needs.backend.outputs.image-tags }}"
            echo ""
            echo "## Frontend"
            echo "DIGEST=${{ needs.frontend.outputs.image-digest }}"
            echo "TAGS:"
            echo "${{ needs.frontend.outputs.image-tags }}"
          } > /tmp/release-metadata.txt

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-app
          path: /tmp/release-metadata.txt
          retention-days: 7
