[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showroom-soundcheck"
version = "0.1.0"
description = "Session-based health check tool for showroom environments"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<14",
]

[project.optional-dependencies]
web = [
    "reflex>=0.9.1,<0.10",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "sqlmodel>=0.0.22,<1",
]

[project.scripts]
showroom-soundcheck = "soundcheck.cli:main"

[tool.setuptools.packages.find]
include = ["soundcheck*"]
